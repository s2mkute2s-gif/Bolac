<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14241f"><title>Bộ lạc thời tiền sử · Đồ họa mới</title><link rel="icon" href="resources/icon.png"><link rel="stylesheet" href="shell.css"></head><body><header><div class="title"><img src="resources/icon.png" alt=""><div>Bộ lạc thời tiền sử<small>CHẠM ĐỂ CHỌN · VUỐT BẢN ĐỒ</small></div></div><div class="tools"><button id="help" aria-label="Hướng dẫn cảm ứng">?</button><button id="pause" aria-label="Tạm dừng">Ⅱ</button><button id="fullscreen" aria-label="Toàn màn hình">⛶</button><button id="menuButton" aria-label="Tùy chọn">☰</button></div></header>
<main><section class="display"><div class="screen-frame"><canvas id="game" width="240" height="320" tabindex="0" aria-label="Màn hình Bộ lạc thời tiền sử"></canvas><span id="touchRing" aria-hidden="true"></span><div id="loading"><strong>Đang mở game gốc</strong><progress id="progress" value="0" max="100"></progress><span id="loadingText">Đọc mã và tài nguyên…</span><button id="retry" hidden>Tải lại</button></div><div id="paused" hidden>Tạm dừng</div></div></section>
</main>
<footer><span id="status" role="status">Điều khiển cảm ứng</span><button id="sound">Âm thanh: bật</button></footer>
<dialog id="menu"><div class="dialog-head"><h2>Tùy chọn</h2><button id="closeMenu" aria-label="Đóng">×</button></div><div id="dialogContent"></div></dialog><script type="module" src="shell.js"></script></body></html>
